{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Student Login</h2>
  <form method="POST" action="{{ url_for('login') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required maxlength="120"
           placeholder="you@student.com">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required
           minlength="6" maxlength="64">

    <button type="submit" class="btn btn-primary full">Login</button>
  </form>
  <p class="muted">No account?
     <a href="{{ url_for('register') }}">Register here</a> &middot;
     <a href="{{ url_for('admin_login') }}">Admin login</a></p>
</div>
{% endblock %}
