{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card wide">
  <h2>Student Registration</h2>
  <form method="POST" action="{{ url_for('register') }}">
    <div class="grid-2">
      <div>
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required
               minlength="3" maxlength="100"
               value="{{ form.get('full_name', '') }}">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required
               maxlength="120" value="{{ form.get('email', '') }}">
      </div>
      <div>
        <label for="password">Password (min 6 chars)</label>
        <input type="password" id="password" name="password" required
               minlength="6" maxlength="64">
      </div>
      <div>
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password"
               required minlength="6" maxlength="64">
      </div>
      <div>
        <label for="roll_number">Roll Number</label>
        <input type="text" id="roll_number" name="roll_number" required
               maxlength="30" value="{{ form.get('roll_number', '') }}">
      </div>
      <div>
        <label for="course">Course</label>
        <input type="text" id="course" name="course" required maxlength="80"
               placeholder="BSc AI &amp; ML"
               value="{{ form.get('course', '') }}">
      </div>
      <div>
        <label for="semester">Semester (1-8)</label>
        <input type="number" id="semester" name="semester" required min="1"
               max="8" value="{{ form.get('semester', '') }}">
      </div>
      <div>
        <label for="cgpa">CGPA (0-10)</label>
        <input type="number" step="0.01" id="cgpa" name="cgpa" required
               min="0" max="10" value="{{ form.get('cgpa', '') }}">
      </div>
      <div>
        <label for="attendance">Attendance % (0-100)</label>
        <input type="number" step="0.1" id="attendance" name="attendance"
               required min="0" max="100"
               value="{{ form.get('attendance', '') }}">
      </div>
    </div>
    <button type="submit" class="btn btn-primary full">Create Account</button>
  </form>
  <p class="muted">Already registered?
     <a href="{{ url_for('login') }}">Login here</a></p>
</div>
{% endblock %}
